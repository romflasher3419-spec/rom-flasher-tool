name: "💡 Feature Request"
description: "Koi naya idea ya improvement? Suggest karo."
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "What would you like to see?"
      description: "Describe the feature or improvement."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "Why is it useful?"
      description: "What problem does it solve for you?"
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: "Your device"
      placeholder: "e.g. Poco X7 Pro"
    validations:
      required: false
