# =============================================================================
#  Update README (YouTube live)
# =============================================================================
#  Keeps two things in README.md fresh, forever and with no manual work:
#
#    * the YouTube subscriber count badge
#    * the "Latest Video" card (thumbnail + title + date + views)
#
#  Runs every 2 hours, and can also be started by hand from the Actions tab.
#  Only commits when something actually changed.
#
#  Optional: add a repository secret named YT_API_KEY with a YouTube Data API v3
#  key to use the official API for the subscriber count. Without it the script
#  reads the public channel page instead — no key, no setup.
# =============================================================================

name: Update README (YouTube live)

on:
  schedule:
    - cron: "15 */2 * * *" # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-live
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the live YouTube block
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 .github/scripts/update_readme.py

      - name: Commit and push if the README changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Nothing changed - no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh live YouTube stats"
          git push
